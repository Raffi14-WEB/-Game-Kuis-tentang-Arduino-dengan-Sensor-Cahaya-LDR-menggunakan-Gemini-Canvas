<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petualangan Tebak Gambar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #f0f4f8; font-family: 'Segoe UI', sans-serif; }
        .hidden { display: none; }
        .card { background: white; border-radius: 1rem; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- Halaman 1: Selamat Datang -->
    <div id="welcome-screen" class="card p-8 max-w-md w-full text-center">
        <h1 class="text-3xl font-bold text-blue-600 mb-4">Selamat Datang!</h1>
        <p class="mb-6 text-gray-600">Siap untuk petualangan tebak gambar? Kumpulkan XP dan jadilah juara!</p>
        <button onclick="showScreen('name-screen')" class="bg-blue-500 text-white px-6 py-2 rounded-full font-bold hover:bg-blue-600">Mulai Sekarang</button>
    </div>

    <!-- Halaman 2: Input Nama -->
    <div id="name-screen" class="card p-8 max-w-md w-full hidden text-center">
        <h2 class="text-2xl font-bold mb-4">Siapa Nama Kamu?</h2>
        <input type="text" id="username" placeholder="Masukkan nama..." class="w-full p-2 border rounded mb-4 text-center">
        <button onclick="startGame()" class="bg-green-500 text-white px-6 py-2 rounded-full font-bold hover:bg-green-600">Lanjut ke Misi</button>
    </div>

    <!-- Halaman 3: Permainan -->
    <div id="game-screen" class="card p-8 max-w-lg w-full hidden">
        <div class="flex justify-between mb-4 text-sm font-bold">
            <span id="player-display"></span>
            <span>XP: <span id="xp-display">0</span></span>
        </div>
        <div id="mission-info" class="mb-4 text-blue-700 font-bold"></div>
        <div id="image-container" class="w-full h-48 bg-gray-200 flex items-center justify-center rounded-lg mb-4 text-gray-500">
            [Area Gambar Misi]
        </div>
        <div id="options-container" class="grid grid-cols-2 gap-3"></div>
    </div>

    <script>
        let userData = { name: "", xp: 0, mission: 0, quizIndex: 0 };
        
        // Contoh data kuis (Silakan sesuaikan dengan materi Anda)
        const quizData = Array.from({ length: 7 }, (_, m) => 
            Array.from({ length: 5 }, (_, q) => ({
                question: `Misi ${m+1} - Pertanyaan ${q+1}`,
                options: ["Jawaban A", "Jawaban B", "Jawaban C", "Jawaban D"],
                answer: "Jawaban A"
            }))
        );

        function showScreen(id) {
            document.querySelectorAll('div[id$="-screen"]').forEach(s => s.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }

        function startGame() {
            userData.name = document.getElementById('username').value || "Pemain";
            document.getElementById('player-display').innerText = userData.name;
            showScreen('game-screen');
            loadQuiz();
        }

        function loadQuiz() {
            const quiz = quizData[userData.mission][userData.quizIndex];
            document.getElementById('mission-info').innerText = `Misi ${userData.mission + 1} - Soal ${userData.quizIndex + 1}`;
            
            const container = document.getElementById('options-container');
            container.innerHTML = '';
            quiz.options.sort(() => Math.random() - 0.5).forEach(opt => {
                const btn = document.createElement('button');
                btn.className = "p-3 bg-blue-100 hover:bg-blue-200 rounded-lg transition";
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(opt, quiz.answer);
                container.appendChild(btn);
            });
        }

        function checkAnswer(selected, correct) {
            if (selected === correct) {
                userData.xp += 20;
                document.getElementById('xp-display').innerText = userData.xp;
            }
            
            userData.quizIndex++;
            if (userData.quizIndex >= 5) {
                userData.quizIndex = 0;
                userData.mission++;
                if (userData.mission >= 7) {
                    alert("Selamat! Kamu menyelesaikan semua misi.");
                    location.reload();
                    return;
                }
            }
            loadQuiz();
        }
    </script>
</body>
</html>
